<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pablo — From context to design</title>
<style>
:root{--ink:#193e35;--paper:#f5f3ec;--lime:#c7df8a;--muted:#66766c;--line:#d9dfd4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #c2603f;outline-offset:5px}header{max-width:1320px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:28px 48px;border-bottom:1px solid var(--line)}.logo{font-family:Georgia,serif;font-size:35px;font-weight:bold;letter-spacing:-2px}.logo span{color:#b76142}.head-right{display:flex;gap:24px;align-items:center;font-size:12px}#language{background:transparent;border:1px solid var(--line);padding:9px 14px;border-radius:20px;color:var(--ink)}main{max-width:1320px;margin:auto;padding:52px 48px 36px}.intro{display:grid;grid-template-columns:1.2fr 1fr;align-items:end;gap:50px;margin-bottom:38px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:650;color:var(--muted)}h1{font-size:clamp(38px,4.2vw,58px);letter-spacing:-2.5px;line-height:1.2;margin:16px 0 0;font-weight:600}h1 em{font-family:Georgia,serif;font-weight:400}.intro p{max-width:415px;margin:0 0 5px;color:var(--muted);font-size:15px;line-height:1.8}.workspace{display:grid;grid-template-columns:340px 1fr;min-height:500px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white}.brief{padding:28px;background:#eeeee5;border-right:1px solid var(--line)}.brief-label{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:18px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px}.tabs button{border:1px solid #cbd4c5;border-radius:20px;padding:8px 11px;background:transparent;font-size:11px;color:var(--ink)}.tabs button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.request{font-size:23px;line-height:1.55;letter-spacing:-.7px;min-height:144px;margin:0}.file{padding:14px 0;border-top:1px solid #d3dacd;border-bottom:1px solid #d3dacd;font-size:12px;margin:20px 0;overflow-wrap:anywhere}.context{font-size:12px;line-height:1.8;color:var(--muted)}.preview{padding:25px 28px;display:flex;flex-direction:column}.preview-top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:20px}.badge{background:#eef2e7;border-radius:12px;padding:5px 9px;letter-spacing:0}.stage{flex:1;min-height:285px;border-radius:6px;padding:32px;background:var(--ink);color:#f5f3ec;position:relative;overflow:hidden}.stage h2{font-size:clamp(24px,2.8vw,38px);line-height:1.2;letter-spacing:-1px;margin:20px 0}.stage p{font-size:12px;line-height:1.7;color:#c8d3c5}.stage small{font-size:9px;letter-spacing:2px;color:var(--lime)}.deliver{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;font-size:11px}.deliver span{padding:7px 10px;background:#f0f2ec;border-radius:4px}.foot{display:flex;justify-content:space-between;gap:20px;margin-top:23px;font-size:11px;line-height:1.8;color:var(--muted)}.foot a{color:var(--ink)}.deck{display:grid;grid-template-columns:1fr .8fr;gap:20px;align-items:center}.chart{height:160px;display:flex;align-items:end;gap:15px;padding:10px 4px;border-bottom:1px solid #668172}.bar{flex:1;background:var(--lime);border-radius:4px 4px 0 0;min-width:20px}.bar:nth-child(2){background:#91b373}.bar:nth-child(3){background:#d98461}.screen{display:grid;grid-template-columns:130px 1fr;min-height:215px;background:#f5f3ec;color:var(--ink);border-radius:7px;overflow:hidden}.side{padding:20px 15px;background:#e6eadf;font-size:11px;line-height:3}.screen-content{padding:22px}.screen h3{margin:0 0 20px}.task{padding:11px;border:1px solid #dce2d4;border-radius:6px;font-size:11px;margin-bottom:9px;display:flex;justify-content:space-between}.task i{font-style:normal;color:#587447}.arch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:185px}.node{background:#f5f3ec;color:var(--ink);border-radius:8px;padding:24px 14px;text-align:center;font-size:13px;flex:1}.arrow{color:var(--lime);font-size:22px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:15px}.before,.after{min-height:185px;background:#f4f2e9;color:var(--ink);padding:21px;border-radius:6px}.before{color:#777;background:#ddd}.before h3{font-size:16px;margin-top:28px}.after h3{font-family:Georgia,serif;font-size:31px;margin-top:24px;margin-bottom:15px}.swatches{display:flex;gap:6px;margin-top:22px}.swatches b{width:25px;height:25px;border-radius:50%;display:block}.demo-note{font-size:10px!important;color:#aabaac!important}.stage-content{animation:enter .25s ease-out}@keyframes enter{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.stage-content{animation:none}}@media(max-width:850px){header{padding:20px 24px}main{padding:30px 24px}.intro{grid-template-columns:1fr;gap:20px}.workspace{grid-template-columns:1fr}.brief{border-right:0;border-bottom:1px solid var(--line)}.request{min-height:0}.stage{min-height:260px}.head-right>span{display:none}.foot{flex-direction:column;gap:8px}.preview{padding:22px}.deck{grid-template-columns:1fr}.chart{height:100px}.screen{grid-template-columns:90px 1fr}.stage{padding:22px}.arch{gap:5px}.node{padding:23px 8px;font-size:11px}.compare{gap:10px}.before,.after{padding:13px}.after h3{font-size:25px}}
</style>
</head>
<body>
<header><div class="logo">Pablo<span>.</span></div><div class="head-right"><span id="header-note"></span><button id="language" type="button">English</button></div></header>
<main>
<section class="intro"><div><div class="eyebrow">FROM CONTEXT TO DESIGN</div><h1 id="headline"></h1></div><p id="intro-copy"></p></section>
<section class="workspace" aria-label="Pablo workflow examples">
<div class="brief"><div class="brief-label" id="choose-label"></div><div class="tabs" id="tabs" role="group" aria-label="Choose a workflow"></div><p class="request" id="request"></p><div class="file" id="file"></div><div class="context" id="context"></div></div>
<div class="preview"><div class="preview-top"><span id="preview-label"></span><span class="badge" id="example-label"></span></div><div class="stage" id="stage" aria-live="polite"></div><div class="deliver" id="deliver"></div></div>
</section>
<footer class="foot"><span id="disclaimer"></span><a href="https://github.com/grooshbene/pablo-design">github.com/grooshbene/pablo-design ↗</a></footer>
</main>
<script>
'use strict';
let lang='ko',selected=0;
const copy={ko:{head:'당신의 디자인 파트너',title:'맥락을 이해하고,<br>디자인을 완성합니다.',intro:'자료를 건네고, 한 문장으로 요청하세요. 목적에 맞는 디자인 방향부터 제작과 검증까지 Pablo가 이어갑니다.',choose:'01 / 요청을 선택해 보세요',preview:'02 / 결과 방향 미리보기',example:'설명용 예시',note:'기능 소개용 데모 · 실제 AI 호출이나 파일 생성은 수행하지 않습니다.',labels:['IR Deck','UI 목업','아키텍처','PPT 리뷰','브랜드 적용']},en:{head:'YOUR DESIGN PARTNER',title:'Understands the context.<br><em>Finishes the design.</em>',intro:'Share the material. Ask in one sentence. Pablo connects purpose, design direction, production, and verification.',choose:'01 / EXPLORE A REQUEST',preview:'02 / PREVIEW THE DIRECTION',example:'Illustrative example',note:'Workflow demonstration only. No AI calls or real file generation.',labels:['Investor deck','UI mockup','Architecture','PPT review','Brand adaptation']}};
const data=[
{ko:['Pablo로 이 내용<br>10장짜리 IR Deck<br>만들어줘.','회사 소개 · 성과 자료','투자자 관점의 스토리 구성 → 정확히 10장 → 편집 가능한 파일','핵심을 먼저.<br>근거는 선명하게.'],en:['Pablo, turn this into<br>a 10-slide<br>investor deck.','Company brief · source metrics','Investor narrative → exactly 10 slides → editable output','The story, focused.<br>The evidence, clear.'],kind:'deck',formats:['PPTX','PDF','10 slides']},
{ko:['Pablo로 이 화면<br>UI 목업 만들어줘.','화면 스크린샷 · 기능 설명','정보 구조 파악 → 화면과 상태 구현 → 주요 동작 확인','팀의 다음 작업을 한눈에.'],en:['Pablo, create a<br>UI mockup from<br>this screen.','Screenshot · feature description','Read the hierarchy → build states → check interactions','Your team’s next move.'],kind:'ui',formats:['HTML / React','Source','Preview']},
{ko:['Pablo로 이 시스템<br>아키텍처 시각화해줘.','시스템 설명 · 설계 문서','구성 요소 확인 → 경계와 흐름 표현 → 관계 대조','복잡한 연결을 명확하게.'],en:['Pablo, visualize<br>this system<br>architecture.','System brief · design documents','Identify components → map boundaries → verify relationships','Complexity, made legible.'],kind:'arch',formats:['SVG / Mermaid','Editable source','Preview']},
{ko:['Pablo가 이 PPT<br>디자인 리뷰하고<br>수정해줘.','기존 발표자료.pptx','전체 리뷰 → 가독성과 계층 개선 → 수정본 재검증','메시지는 유지하고,<br>전달력을 높입니다.'],en:['Pablo, review<br>this presentation<br>and improve it.','Existing presentation.pptx','Review → improve hierarchy → verify the edited deck','Same message.<br>Stronger delivery.'],kind:'review',formats:['Review','Revised PPTX','Preview']},
{ko:['Pablo로 이 디자인을<br>회사 브랜드에 맞춰<br>다시 만들어줘.','기존 디자인 · 브랜드 가이드','실제 브랜드 규칙 추출 → 스타일 적용 → 내용 보존 확인','우리다운 표현으로.'],en:['Pablo, redesign this<br>using our<br>company brand.','Existing design · brand guidelines','Extract brand rules → apply the system → preserve content','Make it feel like us.'],kind:'brand',formats:['Revised source','Brand summary','Preview']}
];
function visual(item,title){const k=lang==='ko';if(item.kind==='deck')return `<div class="deck"><div><small>INVESTOR NARRATIVE / 01</small><h2>${title}</h2><p>${k?'문제에서 제품으로, 성과에서 다음 단계로.':'From problem to product. From evidence to what’s next.'}</p><p class="demo-note">${k?'막대는 레이아웃 예시이며 실제 수치가 아닙니다.':'Bars illustrate layout, not real performance data.'}</p></div><div class="chart" aria-hidden="true"><div class="bar" style="height:38%"></div><div class="bar" style="height:64%"></div><div class="bar" style="height:88%"></div></div></div>`;
if(item.kind==='ui')return `<small>INTERFACE / WORKSPACE</small><h2>${title}</h2><div class="screen"><div class="side">Studio<br>${k?'전체 작업<br>내 작업<br>자료실':'Overview<br>My work<br>Library'}</div><div class="screen-content"><h3>${k?'이번 주의 우선순위':'This week’s priorities'}</h3><div class="task">${k?'온보딩 개선':'Improve onboarding'}<i>●</i></div><div class="task">${k?'고객 인터뷰 정리':'Review interviews'}<i>✓</i></div></div></div>`;
if(item.kind==='arch')return `<small>SYSTEM / DATA FLOW</small><h2>${title}</h2><div class="arch"><div class="node">Client</div><span class="arrow">→</span><div class="node">API</div><span class="arrow">→</span><div class="node">Database</div></div><p class="demo-note">${k?'설명용 구조입니다. 실제 작업에서는 제공된 구성만 표현합니다.':'Illustrative topology. Real work uses your supplied components.'}</p>`;
return `<small>${item.kind==='brand'?'BRAND / APPLICATION':'REVIEW / HIERARCHY'}</small><h2>${title}</h2><div class="compare"><div class="before"><small style="color:#777">BEFORE</small><h3>${k?'모든 정보가 같은 크기':'Every message, equal weight'}</h3><div style="height:5px;background:#aaa;width:80%"></div></div><div class="after"><small style="color:#59744b">AFTER</small><h3>${item.kind==='brand'?'Evergreen.':k?'핵심부터.':'Focus first.'}</h3><div class="swatches"><b style="background:#193e35"></b><b style="background:#c7df8a"></b><b style="background:#d98461"></b></div></div></div><p class="demo-note">${k?'설명용 가상 브랜드와 레이아웃입니다.':'Fictional brand and illustrative layouts.'}</p>`;}
function render(){const c=copy[lang],item=data[selected],v=item[lang];document.documentElement.lang=lang;document.getElementById('header-note').textContent=c.head;document.getElementById('headline').innerHTML=c.title;document.getElementById('intro-copy').textContent=c.intro;document.getElementById('choose-label').textContent=c.choose;document.getElementById('preview-label').textContent=c.preview;document.getElementById('example-label').textContent=c.example;document.getElementById('disclaimer').textContent=c.note;document.getElementById('language').textContent=lang==='ko'?'English':'한국어';document.getElementById('language').setAttribute('aria-label',lang==='ko'?'Switch to English':'한국어로 전환');document.getElementById('tabs').innerHTML=c.labels.map((label,i)=>`<button type="button" data-index="${i}" aria-pressed="${selected===i}">${label}</button>`).join('');document.getElementById('request').innerHTML=v[0];document.getElementById('file').textContent=v[1];document.getElementById('context').textContent=v[2];document.getElementById('stage').innerHTML=`<div class="stage-content">${visual(item,v[3])}</div>`;document.getElementById('deliver').innerHTML=item.formats.map(t=>`<span>${t}</span>`).join('');}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;selected=Number(b.dataset.index);render();document.querySelector(`[data-index="${selected}"]`).focus();});document.getElementById('language').addEventListener('click',()=>{lang=lang==='ko'?'en':'ko';render();});render();
</script>
</body>
</html>
